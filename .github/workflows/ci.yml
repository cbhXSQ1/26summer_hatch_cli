name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  build:
    runs-on: windows-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build
        run: pip install build
      - name: Build wheel
        run: python -m build
      - name: Verify wheel installs
        shell: bash
        run: |
          pip install dist/*.whl
          python -m hatch.cli --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
